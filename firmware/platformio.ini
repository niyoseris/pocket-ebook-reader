; ============================================================================
;  Pocket Reader  --  ESP32-C3 e-ink ebook reader
;  PlatformIO project file
;
;  Build (PCB / DevKitM-1):    pio run -e esp32-c3-devkitm-1 -t upload
;  Build (XIAO breadboard):    pio run -e seeed_xiao_esp32c3 -t upload
;  Upload LittleFS data:       pio run -e esp32-c3-devkitm-1 -t uploadfs
; ============================================================================

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DPOCKET_READER_VERSION=\"1.0.0\"

; lib_deps = intentionally empty.
;   This project is deliberately dependency-free beyond the ESP32 Arduino core:
;     * We implement our own SSD1680 driver (src/epd.cpp + src/epd_lut.h), so
;       there is NO GxEPD2 dependency, no Adafruit_GFX, no U8g2.
;     * JSON is hand-rolled (src/wifi_xfer.cpp), so there is NO ArduinoJson.
;     * Fonts are our own .epf format (src/font.cpp).
;
;   GxEPD2 as a drop-in alternative:
;     GxEPD2 (https://github.com/ZinggJM/GxEPD2) ships a ready-made driver for
;     this exact panel: the class GxEPD2_213_GDEY0213B74 in
;     GxEPD2_213_GDEY0213B74.cpp / .hpp. If you ever want to swap our driver
;     out, add `zinggjm/GxEPD2` to lib_deps and replace the body of
;     epdInit()/epdFullRefresh()/epdPartialRefresh() in src/epd.cpp with
;     GxEPD2_213_GDEY0213B74 calls; the vendor LUT tables in src/epd_lut.h
;     then become redundant because GxEPD2 carries the same tables internally.
;     Everything above the driver (Canvas, book, UI) is driver-agnostic and
;     only talks to the framebuffer + epdDirty()/epdPartialRefresh().
lib_deps =

; ---------------------------------------------------------------------------
; PCB build -- bare ESP32-C3-DevKitM-1 module on our own board.
; ---------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
extends = env
board = esp32-c3-devkitm-1
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DBOARD_PCB=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Breadboard build -- Seeed Studio XIAO ESP32C3 (note: the real board id keeps
; the vendor's spelling "xiao"). Same firmware, same pin map, only the board
; definition differs.
;
; ARDUINO_USB_MODE=1 + ARDUINO_USB_CDC_ON_BOOT=1 make the USB-Serial-JTAG port
; enumerate as the "Serial" device. UART0 (GPIO20/GPIO21) is left completely
; quiet -- GPIO20 is BTN_MENU on this board, so we must never print to UART0.
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c3]
extends = env
board = seeed_xiao_esp32c3
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Short alias so `pio run -e xiao` works too. Extends the breadboard env and
; only adds a marker define, so there is no chance of the two drifting apart.
; ---------------------------------------------------------------------------
[env:xiao]
extends = env:seeed_xiao_esp32c3
build_flags =
    ${env:seeed_xiao_esp32c3.build_flags}
    -DENV_ALIAS_XIAO=1
