<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Pocket Reader — Easy Build Wiring Diagram</title>
  <desc>Wiring diagram for the Seeed XIAO ESP32-C3, the Waveshare 2.13 inch e-paper module, three buttons and the Li-Po battery. Colours match docs/04 §1.2.</desc>

  <defs>
    <style>
      .board   { fill: #f1f5f9; stroke: #334155; stroke-width: 1.8; rx: 8; }
      .btitle  { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .bsub    { fill: #64748b; font-size: 11.5px; }
      .pad     { fill: #ffffff; stroke: #334155; stroke-width: 1.4; }
      .padname { fill: #0f172a; font-size: 11.5px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .padgpio { fill: #64748b; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pinlbl  { fill: #334155; font-size: 11px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .big     { fill: #0f172a; font-size: 21px; font-weight: 700; }
      .sub     { fill: #64748b; font-size: 12.5px; }
      .note    { fill: #475569; font-size: 11.5px; }
      .warnbox { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.3; rx: 6; }
      .warn    { fill: #b91c1c; font-size: 11.5px; font-weight: 600; }
      .infobox { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.3; rx: 6; }
      .info    { fill: #1d4ed8; font-size: 11.5px; }
    </style>
  </defs>

  <rect width="1100" height="760" fill="#ffffff"/>

  <text x="32" y="42" class="big">Easy build — Wiring diagram</text>
  <text x="32" y="64" class="sub">Seeed XIAO ESP32-C3 + Waveshare 2.13&quot; e-Paper Module (V3) + 3 buttons + 1S Li-Po</text>

  <!-- ==================== XIAO ==================== -->
  <rect x="60" y="110" width="250" height="330" class="board"/>
  <text x="185" y="138" class="btitle" text-anchor="middle">XIAO ESP32-C3</text>
  <text x="185" y="156" class="bsub" text-anchor="middle">21 × 17.8 mm · charge circuit included</text>
  <line x1="80" y1="170" x2="290" y2="170" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Right edge pads -->
  <g>
    <rect x="288" y="188" width="26" height="18" class="pad"/>
    <text x="278" y="202" class="padname" text-anchor="end">D2</text>
    <text x="322" y="196" class="padgpio">GPIO4</text>
  </g>
  <g>
    <rect x="288" y="222" width="26" height="18" class="pad"/>
    <text x="278" y="236" class="padname" text-anchor="end">D4</text>
    <text x="322" y="230" class="padgpio">GPIO6</text>
  </g>
  <g>
    <rect x="288" y="256" width="26" height="18" class="pad"/>
    <text x="278" y="270" class="padname" text-anchor="end">D5</text>
    <text x="322" y="264" class="padgpio">GPIO7</text>
  </g>
  <g>
    <rect x="288" y="290" width="26" height="18" class="pad"/>
    <text x="278" y="304" class="padname" text-anchor="end">D10</text>
    <text x="322" y="298" class="padgpio">GPIO10</text>
  </g>
  <g>
    <rect x="288" y="324" width="26" height="18" class="pad"/>
    <text x="278" y="338" class="padname" text-anchor="end">D8</text>
    <text x="322" y="332" class="padgpio">GPIO8</text>
  </g>
  <g>
    <rect x="288" y="358" width="26" height="18" class="pad"/>
    <text x="278" y="372" class="padname" text-anchor="end">D9</text>
    <text x="322" y="366" class="padgpio">GPIO9</text>
  </g>
  <g>
    <rect x="288" y="392" width="26" height="18" class="pad"/>
    <text x="278" y="406" class="padname" text-anchor="end">3V3</text>
    <text x="322" y="400" class="padgpio">output</text>
  </g>
  <g>
    <rect x="288" y="420" width="26" height="18" class="pad"/>
    <text x="278" y="434" class="padname" text-anchor="end">GND</text>
  </g>

  <!-- Left edge: button and battery pads -->
  <g>
    <rect x="56" y="188" width="26" height="18" class="pad"/>
    <text x="92" y="202" class="padname">D1</text>
    <text x="92" y="214" class="padgpio">GPIO3 · wake</text>
  </g>
  <g>
    <rect x="56" y="240" width="26" height="18" class="pad"/>
    <text x="92" y="254" class="padname">D0</text>
    <text x="92" y="266" class="padgpio">GPIO2 · wake</text>
  </g>
  <g>
    <rect x="56" y="292" width="26" height="18" class="pad"/>
    <text x="92" y="306" class="padname">D7</text>
    <text x="92" y="318" class="padgpio">GPIO20 · no wake</text>
  </g>
  <g>
    <rect x="56" y="344" width="26" height="18" class="pad"/>
    <text x="92" y="358" class="padname">D3</text>
    <text x="92" y="370" class="padgpio">GPIO5 · ADC</text>
  </g>
  <g>
    <rect x="56" y="396" width="26" height="18" class="pad"/>
    <text x="92" y="410" class="padname">BAT+ / BAT−</text>
    <text x="92" y="422" class="padgpio">at the back of the board</text>
  </g>

  <!-- ==================== PANEL ==================== -->
  <rect x="700" y="110" width="250" height="250" class="board"/>
  <text x="825" y="138" class="btitle" text-anchor="middle">E-Paper 2.13&quot; V3</text>
  <text x="825" y="156" class="bsub" text-anchor="middle">250 × 122 px · SSD1680 · 8-pin header</text>
  <line x1="720" y1="170" x2="930" y2="170" stroke="#cbd5e1" stroke-width="1"/>

  <g>
    <rect x="674" y="188" width="26" height="18" class="pad"/>
    <text x="712" y="202" class="padname">CLK</text>
  </g>
  <g>
    <rect x="674" y="222" width="26" height="18" class="pad"/>
    <text x="712" y="236" class="padname">DIN</text>
  </g>
  <g>
    <rect x="674" y="256" width="26" height="18" class="pad"/>
    <text x="712" y="270" class="padname">CS</text>
  </g>
  <g>
    <rect x="674" y="290" width="26" height="18" class="pad"/>
    <text x="712" y="304" class="padname">DC</text>
  </g>
  <g>
    <rect x="674" y="324" width="26" height="18" class="pad"/>
    <text x="712" y="338" class="padname">RST</text>
  </g>
  <g>
    <rect x="674" y="358" width="26" height="18" class="pad"/>
    <text x="712" y="372" class="padname">BUSY</text>
  </g>
  <g>
    <rect x="674" y="392" width="26" height="18" class="pad"/>
    <text x="712" y="406" class="padname">VCC</text>
  </g>
  <g>
    <rect x="674" y="420" width="26" height="18" class="pad"/>
    <text x="712" y="434" class="padname">GND</text>
  </g>

  <!-- ==================== WIRES ==================== -->
  <line x1="314" y1="197" x2="674" y2="197" stroke="#eab308" stroke-width="3.2"/>
  <line x1="314" y1="231" x2="674" y2="231" stroke="#3b82f6" stroke-width="3.2"/>
  <line x1="314" y1="265" x2="674" y2="265" stroke="#22c55e" stroke-width="3.2"/>
  <line x1="314" y1="299" x2="674" y2="299" stroke="#f97316" stroke-width="3.2"/>
  <line x1="314" y1="333" x2="674" y2="333" stroke="#a855f7" stroke-width="3.2"/>
  <line x1="314" y1="367" x2="674" y2="367" stroke="#94a3b8" stroke-width="3.2"/>
  <line x1="314" y1="401" x2="674" y2="401" stroke="#ef4444" stroke-width="3.2"/>
  <line x1="314" y1="429" x2="674" y2="429" stroke="#1f2937" stroke-width="3.2"/>

  <!-- ==================== BUTTONS ==================== -->
  <rect x="80" y="530" width="120" height="72" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="140" y="558" class="padname" text-anchor="middle">SW2</text>
  <text x="140" y="576" class="note" text-anchor="middle">page back</text>
  <text x="140" y="592" class="note" text-anchor="middle">→ D1 (GPIO3)</text>

  <rect x="230" y="530" width="120" height="72" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="290" y="558" class="padname" text-anchor="middle">SW3</text>
  <text x="290" y="576" class="note" text-anchor="middle">page forward</text>
  <text x="290" y="592" class="note" text-anchor="middle">→ D0 (GPIO2)</text>

  <rect x="380" y="530" width="120" height="72" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="440" y="558" class="padname" text-anchor="middle">SW4</text>
  <text x="440" y="576" class="note" text-anchor="middle">menu</text>
  <text x="440" y="592" class="note" text-anchor="middle">→ D7 (GPIO20)</text>

  <!-- button wires -->
  <path d="M 82 197 H 40 V 566 H 80" fill="none" stroke="#3b82f6" stroke-width="2.4"/>
  <path d="M 82 249 H 30 V 566 H 80" fill="none" stroke="#22c55e" stroke-width="2.4"/>
  <path d="M 82 301 H 20 V 566 H 80" fill="none" stroke="#f97316" stroke-width="2.4"/>

  <!-- GND rail -->
  <line x1="140" y1="602" x2="140" y2="648" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="290" y1="602" x2="290" y2="648" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="440" y1="602" x2="440" y2="648" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="140" y1="648" x2="800" y2="648" stroke="#1f2937" stroke-width="3"/>
  <circle cx="140" cy="648" r="3.5" fill="#1f2937"/>
  <circle cx="290" cy="648" r="3.5" fill="#1f2937"/>
  <circle cx="440" cy="648" r="3.5" fill="#1f2937"/>
  <text x="812" y="652" class="pinlbl">GND</text>
  <path d="M 314 429 H 860 V 648" fill="none" stroke="#1f2937" stroke-width="3"/>

  <!-- ==================== BATTERY ==================== -->
  <rect x="530" y="530" width="150" height="72" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="605" y="558" class="padname" text-anchor="middle">Li-Po 1S</text>
  <text x="605" y="576" class="note" text-anchor="middle">500 mAh · protected</text>
  <text x="605" y="592" class="note" text-anchor="middle">502030 / 402025</text>

  <rect x="700" y="548" width="86" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="743" y="566" class="padname" text-anchor="middle" font-size="10.5">power switch</text>
  <text x="743" y="582" class="note" text-anchor="middle">SPDT</text>

  <path d="M 680 552 H 700" fill="none" stroke="#b45309" stroke-width="2.6"/>
  <path d="M 786 552 H 860 V 500" fill="none" stroke="#b45309" stroke-width="2.6"/>
  <path d="M 82 405 H 30 V 700 H 605 V 602" fill="none" stroke="#b45309" stroke-width="2.6"/>

  <text x="40" y="716" class="note">Li-Po (−) directly to the BAT− pad · Li-Po (+) to the BAT+ pad through the switch</text>

  <!-- ==================== WARNINGS ==================== -->
  <rect x="870" y="400" width="212" height="140" class="warnbox"/>
  <text x="884" y="422" class="warn">⚠️ Connect by NAME, not by order</text>
  <text x="884" y="442" class="note">The header order can change</text>
  <text x="884" y="458" class="note">with the panel module revision.</text>
  <text x="884" y="474" class="note">Match the board silkscreen.</text>

  <text x="884" y="500" class="warn">Connect VCC to 3V3</text>
  <text x="884" y="518" class="note">If wired to the 5V pin, the</text>
  <text x="884" y="534" class="note">module's level shifter engages</text>
  <text x="884" y="550" class="note">and BUSY is pulled to 5 V —</text>
  <text x="884" y="566" class="note">harmful to the ESP32-C3 input.</text>

  <rect x="60" y="466" width="600" height="46" class="infobox"/>
  <text x="74" y="486" class="info">The easy build needs NO external pull-up or debounce capacitor —</text>
  <text x="74" y="504" class="info">firmware enables the internal pull-ups. The PCB build has 100k + 100nF (for the wake moment).</text>

  <text x="32" y="742" class="sub">Colours match docs/04 §1.2: yellow CLK · blue DIN · green CS · orange DC · purple RST · grey BUSY · red VCC · black GND · dark orange power.</text>
</svg>
